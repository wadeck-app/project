# Contribution to flow:executions-project-header (the executions list of one project). Host context: only the URL parameter `project`
# (a project reference: the project page accepts an id, a name or an alias). Shown only when the parameter is there.
$type: ButtonLink
# Same size and variant as the header links of the hosts (small, secondary), so that the row is even.
size: sm
variant: secondary
$if: $urlParam.project
label: Project
to: "$concat('/modules/project/p/', $urlParam.project)"
