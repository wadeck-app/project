# Project (route /projects/:project, :project = $route.project: the id, a name or an alias): everything about one project and every change
# of it. The module is the only UI that writes the registry, always through the project SDK (one lock, atomic file).
#
# Conventions
# - Every source answers 200 with `errorText` on failure (inlineErrors): a failing source would blank the whole page.
# - Every form is bound to the project by `ref` (the id, in the initialData that the route builds: `forms.*`); the actions put it
#   in their address ({ref}). The installed shell does not fill {key} of a row action, so removals are done by choosing the value in a select.
# - A refused change is shown by the shell as a toast with the message of the route (the SDK message and what to do).
# - Destructive actions ask for a confirmation first.
#
# Extension points (declared in manifest.json `expose`, contract in README.md):
# - project:project-links  links/buttons about THIS project (root: ButtonLink, IconButton, Badge)
# - project:project-panels sections about THIS project (root: Section, Collapsible, Badge, ButtonLink)
# A contribution cannot declare `$sources` (ignored); it reads this page's data (`$sources.detail.project.*`) and `$route.project`.
# The "Related" section below is filled by the other modules through the convention GET /api/modules/<id>/related/project/<projectId>.
$sources:
  detail:
    url: GET /api/modules/project/projects/{project}?inlineErrors=true
    params:
      project: $route.project
  related:
    url: GET /api/modules/project/projects/{project}/related?inlineErrors=true
    params:
      project: $route.project
  links:
    url: GET /api/slots/project:project-links
  panels:
    url: GET /api/slots/project:project-panels

$actions:
  rename:
    url: PUT /api/modules/project/projects/{ref}/name
    successMessage: Project renamed
    errorPrefix: Could not rename
    reloadSources: true
  setSlug:
    url: PUT /api/modules/project/projects/{ref}/slug
    confirm: Change the folder name? The folder of this project in the registry is MOVED to the new name. Stop the tools that use it first (the daemons of task, queue and flow), or the move is refused and nothing changes.
    successMessage: Folder name changed, the folder was moved
    errorPrefix: Could not change the folder name (nothing was changed unless the message says otherwise)
    reloadSources: true
  addAlias:
    url: POST /api/modules/project/projects/{ref}/aliases
    successMessage: Alias added
    errorPrefix: Could not add the alias
    reloadSources: true
  removeAlias:
    url: DELETE /api/modules/project/projects/{ref}/aliases
    confirm: Remove this alias?
    successMessage: Alias removed
    errorPrefix: Could not remove the alias
    reloadSources: true
  addLabels:
    url: POST /api/modules/project/projects/{ref}/labels
    successMessage: Labels added
    errorPrefix: Could not add the labels
    reloadSources: true
  removeLabels:
    url: DELETE /api/modules/project/projects/{ref}/labels
    confirm: Remove this label?
    successMessage: Label removed
    errorPrefix: Could not remove the label
    reloadSources: true
  setParent:
    url: PUT /api/modules/project/projects/{ref}/parent
    successMessage: Parent changed
    errorPrefix: Could not change the parent
    reloadSources: true
  clearParent:
    url: DELETE /api/modules/project/projects/{ref}/parent
    confirm: Remove the parent of this project?
    successMessage: Parent cleared
    errorPrefix: Could not clear the parent
    reloadSources: true
  setGit:
    url: PUT /api/modules/project/projects/{ref}/git
    successMessage: Git url changed
    errorPrefix: Could not change the git url
    reloadSources: true
  clearGit:
    url: DELETE /api/modules/project/projects/{ref}/git
    confirm: Clear the git url of this project?
    successMessage: Git url cleared
    errorPrefix: Could not clear the git url
    reloadSources: true
  addPath:
    url: POST /api/modules/project/projects/{ref}/paths
    successMessage: Path added
    errorPrefix: Could not add the path
    reloadSources: true
  removePath:
    url: DELETE /api/modules/project/projects/{ref}/paths
    confirm: Remove this path from the project? The folder itself is not touched.
    successMessage: Path removed
    errorPrefix: Could not remove the path
    reloadSources: true
  movePath:
    url: PUT /api/modules/project/projects/{ref}/paths
    successMessage: Path moved
    errorPrefix: Could not move the path
    reloadSources: true
  setMain:
    url: PUT /api/modules/project/projects/{ref}/main
    successMessage: Main path changed
    errorPrefix: Could not change the main path
    reloadSources: true
  removeProject:
    url: DELETE /api/modules/project/projects/{ref}
    confirm: Remove this project? It goes to the trash and can be restored; its tool folders are kept.
    successMessage: Project removed (it is in the trash)
    errorPrefix: Could not remove the project
    reloadSources: true
  # Popups: openX (no url) stores a marker under resultKey and the DialogForm with `visible: $<resultKey>` opens; closeX (`clear: true`, needs dsl-renderer >= 2026.11.21-359,
  # in the app-core-cli that bundles it) removes the key: it is the `onClose` of the dialog (Cancel, the X, Escape, a successful Save).
  openRename: { resultKey: dlgRename }
  closeRename: { resultKey: dlgRename, clear: true }
  openSlug: { resultKey: dlgSlug }
  closeSlug: { resultKey: dlgSlug, clear: true }
  openAddAlias: { resultKey: dlgAddAlias }
  closeAddAlias: { resultKey: dlgAddAlias, clear: true }
  openRemoveAlias: { resultKey: dlgRemoveAlias }
  closeRemoveAlias: { resultKey: dlgRemoveAlias, clear: true }
  openAddLabels: { resultKey: dlgAddLabels }
  closeAddLabels: { resultKey: dlgAddLabels, clear: true }
  openRemoveLabels: { resultKey: dlgRemoveLabels }
  closeRemoveLabels: { resultKey: dlgRemoveLabels, clear: true }
  openGit: { resultKey: dlgGit }
  closeGit: { resultKey: dlgGit, clear: true }
  openParent: { resultKey: dlgParent }
  closeParent: { resultKey: dlgParent, clear: true }
  openAddPath: { resultKey: dlgAddPath }
  closeAddPath: { resultKey: dlgAddPath, clear: true }
  openSetMain: { resultKey: dlgSetMain }
  closeSetMain: { resultKey: dlgSetMain, clear: true }
  openMovePath: { resultKey: dlgMovePath }
  closeMovePath: { resultKey: dlgMovePath, clear: true }
  openRemovePath: { resultKey: dlgRemovePath }
  closeRemovePath: { resultKey: dlgRemovePath, clear: true }


# A/B experiment (dev builds only, the floating dock): `current` is the tabbed page, the others are alternatives of the information
# architecture. Every variant keeps every capability (same $actions). The parts are written once, as YAML anchors (&name) in the first
# variant that shows them, and reused with aliases (*name) by the others: an alias must come AFTER its anchor in this file, and
# js-yaml expands them when the view is compiled.
$type: PageContent
sections:
  - $type: AbTest
    id: detail-layout
    label: Project page layout
    initial: current
    variants:
      current:
        label: Current
        hint: Tabs overview, tasks, flows, queue and settings; the settings are one form per change.
        view:
          $type: VerticalStack
          gap: gap-4
          items:
            - &hdr
              $type: PageHeader
              title: $sources.detail.project.name
              subtitle: $sources.detail.project.chainText
            - &errBadge
              $type: Badge
              $if: $sources.detail.errorText
              label: $sources.detail.errorText
              variant: danger
            - &warnBadge
              $type: Badge
              $if: $sources.detail.project.warningsText
              label: $sources.detail.project.warningsText
              variant: warning
            - &virtBadge
              $type: Badge
              $if: $sources.detail.project.virtualText
              label: Virtual project (no folder)
              variant: info
            # Extension point project:project-links.
            - &linksStack
              $type: HorizontalStack
              $if: $sources.detail.project
              gap: gap-2
              items:
                - $type: ExtensionSlot
                  items: $sources.links
            - &parentBtn
              $type: ButtonLink
              $if: $sources.detail.project.parent
              label: Open the parent project
              to: $sources.detail.project.parent.href
              size: sm

            # The page is organised in tabs, the selected one is kept in the URL (?tab=): everything that happens in the project first
            # (overview, one tab per tool), the settings of the registry entry last. A tab per tool is static: the tools are the
            # optionalRequires of the manifest.
            - $type: PageTabs
              $if: $sources.detail.project
              urlParam: tab
              tabs:
                - id: overview
                  label: Overview
                  children:
                    - $type: Section
                      title: Statistics
                      items:
                        - &relErr
                          $type: Badge
                          $if: $sources.related.errorText
                          label: $sources.related.errorText
                          variant: warning
                        - &relEmpty
                          $type: Badge
                          $if: $sources.related.emptyText
                          label: $sources.related.emptyText
                          variant: info
                        - &summaryTable
                          $type: DataTable
                          $if: $sources.related.hasPanels
                          rows: $sources.related.summary
                          navigateTo: '{href}'
                          emptyMessage: Nothing related
                          columns:
                            - { key: 'module', label: 'Module', nowrap: true }
                            - { key: 'title', label: 'What' }
                            - { key: 'countText', label: 'Count', nowrap: true }
                            - { key: 'noteText', label: '', nowrap: true }
                            - { key: 'seeAllText', label: '', href: '{href}', nowrap: true }
                        - &relWarn
                          $type: VerticalStack
                          $if: $sources.related.warnings.length
                          gap: gap-1
                          items:
                            - $type: DataTable
                              rows: $sources.related.warnings
                              emptyMessage: No warning
                              columns:
                                - { key: 'text', label: 'Modules that could not answer' }
                    # Extension point project:project-panels.
                    - &panelsSlot
                      $type: ExtensionSlot
                      $if: $sources.detail.project
                      items: $sources.panels
                - id: task
                  label: Tasks
                  children:
                    - &taskEmpty
                      $type: Badge
                      $if: $sources.related.tabs.task.emptyText
                      label: $sources.related.tabs.task.emptyText
                      variant: info
                    - &taskSection
                      $type: Section
                      $if: $sources.related.tabs.task.title
                      title: $sources.related.tabs.task.title
                      items:
                        - $type: HorizontalStack
                          gap: gap-2
                          items:
                            - $type: Badge
                              label: $sources.related.tabs.task.countText
                            - $type: Badge
                              $if: $sources.related.tabs.task.noteText
                              label: $sources.related.tabs.task.noteText
                              variant: warning
                            - $type: ButtonLink
                              $if: $sources.related.tabs.task.seeAllText
                              label: See all tasks
                              to: $sources.related.tabs.task.href
                              size: sm
                        - $type: DataTable
                          rows: $sources.related.tabs.task.rows
                          navigateTo: '{href}'
                          emptyMessage: Nothing yet
                          columns:
                            - { key: 'label', label: 'Item' }
                            - { key: 'subtitle', label: '' }
                - id: flow
                  label: Flows
                  children:
                    - &flowEmpty
                      $type: Badge
                      $if: $sources.related.tabs.flow.emptyText
                      label: $sources.related.tabs.flow.emptyText
                      variant: info
                    - &flowSection
                      $type: Section
                      $if: $sources.related.tabs.flow.title
                      title: $sources.related.tabs.flow.title
                      items:
                        - $type: HorizontalStack
                          gap: gap-2
                          items:
                            - $type: Badge
                              label: $sources.related.tabs.flow.countText
                            - $type: Badge
                              $if: $sources.related.tabs.flow.noteText
                              label: $sources.related.tabs.flow.noteText
                              variant: warning
                            - $type: ButtonLink
                              $if: $sources.related.tabs.flow.seeAllText
                              label: See all flow executions
                              to: $sources.related.tabs.flow.href
                              size: sm
                        - $type: DataTable
                          rows: $sources.related.tabs.flow.rows
                          navigateTo: '{href}'
                          emptyMessage: Nothing yet
                          columns:
                            - { key: 'label', label: 'Item' }
                            - { key: 'subtitle', label: '' }
                - id: queue
                  label: Queue
                  children:
                    - &queueEmpty
                      $type: Badge
                      $if: $sources.related.tabs.queue.emptyText
                      label: $sources.related.tabs.queue.emptyText
                      variant: info
                    - &queueSection
                      $type: Section
                      $if: $sources.related.tabs.queue.title
                      title: $sources.related.tabs.queue.title
                      items:
                        - $type: HorizontalStack
                          gap: gap-2
                          items:
                            - $type: Badge
                              label: $sources.related.tabs.queue.countText
                            - $type: Badge
                              $if: $sources.related.tabs.queue.noteText
                              label: $sources.related.tabs.queue.noteText
                              variant: warning
                            - $type: ButtonLink
                              $if: $sources.related.tabs.queue.seeAllText
                              label: See all queue entries
                              to: $sources.related.tabs.queue.href
                              size: sm
                        - $type: DataTable
                          rows: $sources.related.tabs.queue.rows
                          navigateTo: '{href}'
                          emptyMessage: Nothing yet
                          columns:
                            - { key: 'label', label: 'Item' }
                            - { key: 'subtitle', label: '' }
                - id: settings
                  label: Settings
                  children:
                    - $type: Section
                      $if: $sources.detail.project
                      title: Identity
                      items:
                        - &identityStack
                          $type: VerticalStack
                          gap: gap-1
                          items:
                            - $type: Badge
                              label: $sources.detail.project.idLine
                            - $type: Badge
                              label: $sources.detail.project.aliasesLine
                            - $type: Badge
                              label: $sources.detail.project.labelsLine
                            - $type: Badge
                              label: $sources.detail.project.gitLine
                            - $type: Badge
                              label: $sources.detail.project.slugLine
                        - &fRename
                          $type: Form
                          onSubmit: $ctx.rename
                          initialData: $sources.detail.forms.rename
                          fields:
                            - $type: FieldText
                              label: Name
                              bind: name
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Rename
                        - &fSetSlug
                          $type: Form
                          onSubmit: $ctx.setSlug
                          initialData: $sources.detail.forms.slug
                          fields:
                            - $type: FieldText
                              label: Folder name (slug, kebab-case, 1 to 20 characters; changing it moves the folder)
                              bind: slug
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Change the folder name
                        - &fAddAlias
                          $type: Form
                          onSubmit: $ctx.addAlias
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldText
                              label: New alias
                              bind: alias
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Add the alias
                        - &fRemoveAlias
                          $type: Form
                          $if: $sources.detail.options.aliases.length
                          onSubmit: $ctx.removeAlias
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldSelect
                              label: Alias to remove
                              bind: alias
                              options: $sources.detail.options.aliases
                              placeholder: Choose an alias
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Remove the alias
                        - &fAddLabels
                          $type: Form
                          onSubmit: $ctx.addLabels
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldText
                              label: Labels to add (separated by spaces or commas, e.g. state::production team::blue)
                              bind: labels
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Add the labels
                        - &fRemoveLabels
                          $type: Form
                          $if: $sources.detail.options.labels.length
                          onSubmit: $ctx.removeLabels
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldSelect
                              label: Label to remove
                              bind: labels
                              options: $sources.detail.options.labels
                              placeholder: Choose a label
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Remove the label
                        - &fSetGit
                          $type: Form
                          onSubmit: $ctx.setGit
                          initialData: $sources.detail.forms.git
                          fields:
                            - $type: FieldText
                              label: Git url
                              bind: git
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Set the git url
                        - &fClearGit
                          $type: Form
                          $if: $sources.detail.project.git
                          onSubmit: $ctx.clearGit
                          initialData: $sources.detail.forms.empty
                          fields: []
                          actions:
                            - $type: ButtonAction
                              label: Clear the git url
                              variant: danger
                              type: submit

                    - $type: Section
                      $if: $sources.detail.project
                      title: Hierarchy
                      items:
                        - &childrenTable
                          $type: DataTable
                          $if: $sources.detail.project.hasChildren
                          rows: $sources.detail.project.children
                          navigateTo: '{href}'
                          emptyMessage: No child
                          columns:
                            - { key: 'name', label: 'Children', nowrap: true }
                            - { key: 'id', label: 'ID', mono: true, nowrap: true }
                            - { key: 'virtualText', label: '', nowrap: true }
                        - &descTable
                          $type: DataTable
                          $if: $sources.detail.project.descendantsCount
                          rows: $sources.detail.project.descendants
                          navigateTo: '{href}'
                          emptyMessage: No descendant
                          columns:
                            - { key: 'name', label: 'All descendants', nowrap: true }
                            - { key: 'parentName', label: 'Parent', nowrap: true }
                            - { key: 'id', label: 'ID', mono: true, nowrap: true }
                        - &fSetParent
                          $type: Form
                          onSubmit: $ctx.setParent
                          initialData: $sources.detail.forms.parent
                          fields:
                            - $type: FieldSelect
                              label: Parent
                              bind: parent
                              options: $sources.detail.options.parents
                              placeholder: Choose a parent
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Set the parent
                        - &fClearParent
                          $type: Form
                          $if: $sources.detail.project.parent
                          onSubmit: $ctx.clearParent
                          initialData: $sources.detail.forms.empty
                          fields: []
                          actions:
                            - $type: ButtonAction
                              label: Remove the parent
                              variant: danger
                              type: submit

                    - $type: Section
                      $if: $sources.detail.project
                      title: Folders
                      items:
                        - &virtFolderBadge
                          $type: Badge
                          $if: $sources.detail.project.virtualText
                          label: No folder is registered (virtual project). Add one below.
                          variant: info
                        - &pathsTable
                          $type: DataTable
                          $if: $sources.detail.project.hasPaths
                          rows: $sources.detail.project.paths
                          emptyMessage: No folder
                          columns:
                            - { key: 'pathText', label: 'Path', mono: true, truncate: true, title: '{pathText}' }
                            - { key: 'mainText', label: '', nowrap: true }
                        - &toolFoldersBadge
                          $type: Badge
                          label: $sources.detail.project.toolFoldersText
                        - &fAddPath
                          $type: Form
                          onSubmit: $ctx.addPath
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldText
                              label: Folder to add (an existing folder)
                              bind: path
                              required: true
                            - $type: Switch
                              label: Make it the main folder
                              bind: main
                          actions:
                            - $type: ButtonSave
                              label: Add the folder
                        - &fSetMain
                          $type: Form
                          $if: $sources.detail.options.otherPaths.length
                          onSubmit: $ctx.setMain
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldSelect
                              label: New main folder
                              bind: path
                              options: $sources.detail.options.otherPaths
                              placeholder: Choose a folder
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Make it the main folder
                        - &fMovePath
                          $type: Form
                          $if: $sources.detail.options.paths.length
                          onSubmit: $ctx.movePath
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldSelect
                              label: Folder that moved
                              bind: from
                              options: $sources.detail.options.paths
                              placeholder: Choose a folder
                              required: true
                            - $type: FieldText
                              label: Its new location (an existing folder)
                              bind: to
                              required: true
                          actions:
                            - $type: ButtonSave
                              label: Move the folder
                        - &fRemovePath
                          $type: Form
                          $if: $sources.detail.options.paths.length
                          onSubmit: $ctx.removePath
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: FieldSelect
                              label: Folder to remove
                              bind: path
                              options: $sources.detail.options.paths
                              placeholder: Choose a folder
                              required: true
                            - $type: FieldSelect
                              $if: $sources.detail.options.otherPaths.length
                              label: New main folder (needed when removing the main folder)
                              bind: newMain
                              options: $sources.detail.options.otherPaths
                              placeholder: Keep the current main folder
                          actions:
                            - $type: ButtonSave
                              label: Remove the folder

                    - $type: Section
                      $if: $sources.detail.project
                      title: Remove
                      items:
                        - &fRemoveProject
                          $type: Form
                          onSubmit: $ctx.removeProject
                          initialData: $sources.detail.forms.empty
                          fields:
                            - $type: Switch
                              $if: $sources.detail.project.hasChildren
                              label: Also remove the descendants (required when the project has children)
                              bind: recursive
                          actions:
                            - $type: ButtonAction
                              label: Remove the project
                              variant: danger

      # Round 2 (the first round was refused): every change is a small popup (DialogForm) with ONE field group, opened from a button; the
      # page itself only shows facts. The dialogs are written once (&dialogs) and reused. A change that needs no field (clear the git url,
      # remove the parent, remove the project) stays a one-button form in a folded "Danger zone" (a dialog has no way to submit without a field).
      pencils:
        label: Pencils
        hint: Facts in a short list, a Change button beside each; each button opens a small popup with the one field to change.
        view:
          $type: VerticalStack
          gap: gap-4
          items:
            - *hdr
            - *errBadge
            - *warnBadge
            - *virtBadge
            - *linksStack
            - *parentBtn
            - $type: Section
              $if: $sources.detail.project
              title: Project
              items:
                - $type: VerticalStack
                  gap: gap-1
                  items:
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: Badge
                          label: $sources.detail.project.idLine
                        - { $type: ButtonAction, label: Rename, variant: ghost, size: sm, onClick: $ctx.openRename }
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: Badge
                          label: $sources.detail.project.slugLine
                        - { $type: ButtonAction, label: Change, variant: ghost, size: sm, onClick: $ctx.openSlug }
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: Badge
                          label: $sources.detail.project.aliasesLine
                        - { $type: ButtonAction, label: Add, variant: ghost, size: sm, onClick: $ctx.openAddAlias }
                        - { $type: ButtonAction, $if: $sources.detail.options.aliases.length, label: Remove, variant: ghost, size: sm, onClick: $ctx.openRemoveAlias }
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: Badge
                          label: $sources.detail.project.labelsLine
                        - { $type: ButtonAction, label: Add, variant: ghost, size: sm, onClick: $ctx.openAddLabels }
                        - { $type: ButtonAction, $if: $sources.detail.options.labels.length, label: Remove, variant: ghost, size: sm, onClick: $ctx.openRemoveLabels }
                    - $type: HorizontalStack
                      gap: gap-2
                      items:
                        - $type: Badge
                          label: $sources.detail.project.gitLine
                        - { $type: ButtonAction, label: Change, variant: ghost, size: sm, onClick: $ctx.openGit }
            - &dialogs
              $type: VerticalStack
              $if: $sources.detail.project
              items:
                - $type: DialogForm
                  title: Rename the project
                  visible: $dlgRename
                  onClose: $ctx.closeRename
                  initialData: $sources.detail.forms.rename
                  onSubmit: $ctx.rename
                  size: sm
                  fields:
                    - { $type: FieldText, label: Name, bind: name, required: true }
                - $type: DialogForm
                  title: Change the folder name
                  visible: $dlgSlug
                  onClose: $ctx.closeSlug
                  initialData: $sources.detail.forms.slug
                  onSubmit: $ctx.setSlug
                  size: sm
                  fields:
                    - { $type: FieldText, label: 'Folder name (kebab-case, 1 to 20 characters; the folder is moved)', bind: slug, required: true }
                - $type: DialogForm
                  title: Add an alias
                  visible: $dlgAddAlias
                  onClose: $ctx.closeAddAlias
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.addAlias
                  size: sm
                  fields:
                    - { $type: FieldText, label: Alias, bind: alias, required: true }
                - $type: DialogForm
                  title: Remove an alias
                  visible: $dlgRemoveAlias
                  onClose: $ctx.closeRemoveAlias
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.removeAlias
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: Alias, bind: alias, options: $sources.detail.options.aliases, placeholder: Choose an alias, required: true }
                - $type: DialogForm
                  title: Add labels
                  visible: $dlgAddLabels
                  onClose: $ctx.closeAddLabels
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.addLabels
                  size: sm
                  fields:
                    - { $type: FieldText, label: 'Labels (separated by spaces or commas, e.g. state::production team::blue)', bind: labels, required: true }
                - $type: DialogForm
                  title: Remove a label
                  visible: $dlgRemoveLabels
                  onClose: $ctx.closeRemoveLabels
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.removeLabels
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: Label, bind: labels, options: $sources.detail.options.labels, placeholder: Choose a label, required: true }
                - $type: DialogForm
                  title: Change the git url
                  visible: $dlgGit
                  onClose: $ctx.closeGit
                  initialData: $sources.detail.forms.git
                  onSubmit: $ctx.setGit
                  size: sm
                  fields:
                    - { $type: FieldText, label: Git url, bind: git, required: true }
                - $type: DialogForm
                  title: Change the parent
                  visible: $dlgParent
                  onClose: $ctx.closeParent
                  initialData: $sources.detail.forms.parent
                  onSubmit: $ctx.setParent
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: Parent, bind: parent, options: $sources.detail.options.parents, placeholder: Choose a parent, required: true }
                - $type: DialogForm
                  title: Add a folder
                  visible: $dlgAddPath
                  onClose: $ctx.closeAddPath
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.addPath
                  size: sm
                  fields:
                    - { $type: FieldText, label: Folder (an existing folder), bind: path, required: true }
                    - { $type: Switch, label: Make it the main folder, bind: main }
                - $type: DialogForm
                  title: Change the main folder
                  visible: $dlgSetMain
                  onClose: $ctx.closeSetMain
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.setMain
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: New main folder, bind: path, options: $sources.detail.options.otherPaths, placeholder: Choose a folder, required: true }
                - $type: DialogForm
                  title: A folder moved
                  visible: $dlgMovePath
                  onClose: $ctx.closeMovePath
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.movePath
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: Folder that moved, bind: from, options: $sources.detail.options.paths, placeholder: Choose a folder, required: true }
                    - { $type: FieldText, label: Its new location (an existing folder), bind: to, required: true }
                - $type: DialogForm
                  title: Remove a folder
                  visible: $dlgRemovePath
                  onClose: $ctx.closeRemovePath
                  initialData: $sources.detail.forms.empty
                  onSubmit: $ctx.removePath
                  size: sm
                  fields:
                    - { $type: FieldSelect, label: Folder, bind: path, options: $sources.detail.options.paths, placeholder: Choose a folder, required: true }
                    - { $type: FieldSelect, $if: $sources.detail.options.otherPaths.length, label: New main folder (needed when removing the main folder), bind: newMain, options: $sources.detail.options.otherPaths, placeholder: Keep the current main folder }
            - $type: PageTabs
              $if: $sources.detail.project
              urlParam: tab
              tabs:
                - id: overview
                  label: Overview
                  children: [*relErr, *relEmpty, *summaryTable, *relWarn, *panelsSlot]
                - id: task
                  label: Tasks
                  children: [*taskEmpty, *taskSection]
                - id: flow
                  label: Flows
                  children: [*flowEmpty, *flowSection]
                - id: queue
                  label: Queue
                  children: [*queueEmpty, *queueSection]
                - id: settings
                  label: Settings
                  children:
                    - $type: Section
                      title: Hierarchy
                      items:
                        - *childrenTable
                        - *descTable
                        - { $type: ButtonAction, label: Change the parent, variant: ghost, size: sm, onClick: $ctx.openParent }
                    - $type: Section
                      title: Folders
                      items:
                        - *virtFolderBadge
                        - *pathsTable
                        - *toolFoldersBadge
                        - &folderButtons
                          $type: HorizontalStack
                          gap: gap-2
                          items:
                            - { $type: ButtonAction, label: Add, variant: ghost, size: sm, onClick: $ctx.openAddPath }
                            - { $type: ButtonAction, $if: $sources.detail.options.otherPaths.length, label: Main folder, variant: ghost, size: sm, onClick: $ctx.openSetMain }
                            - { $type: ButtonAction, $if: $sources.detail.options.paths.length, label: Moved, variant: ghost, size: sm, onClick: $ctx.openMovePath }
                            - { $type: ButtonAction, $if: $sources.detail.options.paths.length, label: Remove, variant: ghost, size: sm, onClick: $ctx.openRemovePath }
                    - $type: Section
                      title: Danger zone
                      items:
                        - &dangerZone
                          $type: Collapsible
                          title: Clear the git url, remove the parent, remove the project
                          items: [*fClearGit, *fClearParent, *fRemoveProject]

      toolbar:
        label: Toolbar
        hint: One row of buttons under the title (rename, folder name, alias, label, git, parent, folders), each opening its popup; no list of facts above the tabs.
        view:
          $type: VerticalStack
          gap: gap-4
          items:
            - *hdr
            - *errBadge
            - *warnBadge
            - *virtBadge
            - *linksStack
            - *parentBtn
            - $type: HorizontalStack
              $if: $sources.detail.project
              gap: gap-2
              wrap: true
              items:
                - { $type: ButtonAction, label: Rename, variant: secondary, size: sm, onClick: $ctx.openRename }
                - { $type: ButtonAction, label: Folder name, variant: secondary, size: sm, onClick: $ctx.openSlug }
                - { $type: ButtonAction, label: Add an alias, variant: secondary, size: sm, onClick: $ctx.openAddAlias }
                - { $type: ButtonAction, $if: $sources.detail.options.aliases.length, label: Remove an alias, variant: ghost, size: sm, onClick: $ctx.openRemoveAlias }
                - { $type: ButtonAction, label: Add labels, variant: secondary, size: sm, onClick: $ctx.openAddLabels }
                - { $type: ButtonAction, $if: $sources.detail.options.labels.length, label: Remove a label, variant: ghost, size: sm, onClick: $ctx.openRemoveLabels }
                - { $type: ButtonAction, label: Git url, variant: secondary, size: sm, onClick: $ctx.openGit }
                - { $type: ButtonAction, label: Parent, variant: secondary, size: sm, onClick: $ctx.openParent }
            - *dialogs
            - $type: PageTabs
              $if: $sources.detail.project
              urlParam: tab
              tabs:
                - id: overview
                  label: Overview
                  children: [*relErr, *relEmpty, *summaryTable, *relWarn, *panelsSlot]
                - id: task
                  label: Tasks
                  children: [*taskEmpty, *taskSection]
                - id: flow
                  label: Flows
                  children: [*flowEmpty, *flowSection]
                - id: queue
                  label: Queue
                  children: [*queueEmpty, *queueSection]
                - id: settings
                  label: Settings
                  children:
                    - $type: Section
                      title: Identity
                      items:
                        - *identityStack
                    - $type: Section
                      title: Hierarchy
                      items: [*childrenTable, *descTable]
                    - $type: Section
                      title: Folders
                      items: [*virtFolderBadge, *pathsTable, *toolFoldersBadge, *folderButtons]
                    - $type: Section
                      title: Danger zone
                      items: [*dangerZone]
