name: CI / Publish

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    # The SDK and the CLI run on every developer machine: build and test both on all three OS
    build-and-test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Run tests
              run: npm test

    publish:
        needs: [build-and-test]
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            # The Go launcher is built by the build.sh of @wadeck-app/singleton-daemon-kit
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash packages/project-cli/ci/scripts/generate-platform-packages.sh project

            - name: Copy artifacts to platform packages
              run: bash packages/project-cli/ci/scripts/copy-binaries.sh

            - name: Set version in all generated packages
              run: |
                  for pkg in project-cli-dist project-cli-win32-x64 project-cli-darwin-arm64 project-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            # What gets published must run and know its version, or the auto-update of the installed CLIs would loop on it
            - name: Verify the generated bundle prints the stamped version
              run: |
                  expected="${{ steps.version.outputs.version }}"
                  actual="$(node packages/project-cli-dist/project.cjs --version)"
                  if [ "$actual" != "$expected" ]; then
                    echo "::error::project.cjs --version printed '$actual', expected '$expected'"
                    exit 1
                  fi
                  node packages/project-cli-dist/project.cjs cli self-check

            # The CLI bundle inlines the SDK: the published CLI has no dependency on it, so there is no version to pin
            - name: Publish project-sdk
              working-directory: packages/project-sdk
              run: |
                  npm pkg set version="${{ steps.version.outputs.version }}"
                  npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish platform packages
              run: |
                  for pkg in project-cli-win32-x64 project-cli-darwin-arm64 project-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package (@wadeck-app/project-cli)
              working-directory: packages/project-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
