name: CI / Publish

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    # The SDK and the CLI run on every developer machine: build and test both on all three OS
    build-and-test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            # The app-core module: layout, manifest and slots (the packaging itself runs in the publish job)
            - name: Check the app-core module
              run: npm run check

            # The log is kept to put its end in an annotation: the job logs are not readable without admin rights
            - name: Run tests
              shell: bash
              run: |
                  set -o pipefail
                  npm test 2>&1 | tee "${{ runner.temp }}/tests.log"

            - name: Annotate the failure of the tests
              if: failure()
              shell: bash
              run: node packages/project-cli/ci/scripts/annotate-failure.mjs "tests (${{ matrix.os }})" "${{ runner.temp }}/tests.log"

    publish:
        needs: [build-and-test]
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        # The version that was published: verify-install installs exactly this one
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            # The Go launcher is built by the build.sh of @wadeck-app/singleton-daemon-kit
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build

            - name: Build Go launchers
              run: npm run build-launcher

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Bundle
              run: npm run bundle
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash packages/project-cli/ci/scripts/generate-platform-packages.sh project:app-module/

            - name: Copy artifacts to platform packages
              run: bash packages/project-cli/ci/scripts/copy-binaries.sh

            - name: Set version in all generated packages
              run: |
                  for pkg in project-cli-dist project-cli-win32-x64 project-cli-darwin-arm64 project-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            # What gets published must run and know its version, or the auto-update of the installed CLIs would loop on it
            - name: Verify the generated bundle prints the stamped version
              # The stamped bundle schedules a background update after each command: keep it away from the real config folder and switch it off
              env:
                  XDG_CONFIG_HOME: ${{ runner.temp }}/project-cli-check
              run: |
                  mkdir -p "$XDG_CONFIG_HOME/project"
                  echo "autoUpdate: false" > "$XDG_CONFIG_HOME/project/config.yml"
                  expected="${{ steps.version.outputs.version }}"
                  actual="$(node packages/project-cli-dist/project.cjs --version)"
                  if [ "$actual" != "$expected" ]; then
                    echo "::error::project.cjs --version printed '$actual', expected '$expected'"
                    exit 1
                  fi
                  node packages/project-cli-dist/project.cjs cli self-check

            # The CLI bundle inlines the SDK: the published CLI has no dependency on it, so there is no version to pin
            - name: Publish project-sdk
              working-directory: packages/project-sdk
              run: |
                  npm pkg set version="${{ steps.version.outputs.version }}"
                  npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish platform packages
              run: |
                  for pkg in project-cli-win32-x64 project-cli-darwin-arm64 project-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package (@wadeck-app/project-cli)
              working-directory: packages/project-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # What was just published is installed from the registry on the three systems, in an isolated temp environment (npm prefix, config folder, home).
    # Skipped when publish did not run. The same scripts can be run locally: see the header of verify-install.sh.
    verify-install:
        needs: [publish]
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            packages: read
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install the published version and check it works (install, --version, self-check, smoke test)
              run: |
                  set -o pipefail
                  bash packages/project-cli/ci/scripts/verify-install.sh "${{ needs.publish.outputs.version }}" 2>&1 | tee "${{ runner.temp }}/verify-install.log"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Annotate the failure of the install check
              if: failure()
              run: node packages/project-cli/ci/scripts/annotate-failure.mjs "verify-install (${{ matrix.os }})" "${{ runner.temp }}/verify-install.log"

            - name: Update from the previous published version, roll back, update again
              run: |
                  set -o pipefail
                  bash packages/project-cli/ci/scripts/verify-update.sh "${{ needs.publish.outputs.version }}" 2>&1 | tee "${{ runner.temp }}/verify-update.log"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Annotate the failure of the update check
              if: failure()
              run: node packages/project-cli/ci/scripts/annotate-failure.mjs "verify-update (${{ matrix.os }})" "${{ runner.temp }}/verify-update.log"
